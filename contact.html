<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanchaYa - Contacto</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="img/favicon.svg">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="contact-page">
    <header class="py-4 mb-4">
        <div class="container text-center">
            <h1>CanchaYa</h1>
        </div>
    </header>

    <main class="container mb-5">
        <div class="mb-4">
            <a href="index.html" class="btn btn-outline-dark">&larr; Volver a canchas</a>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-success text-white py-3">
                        <h2 class="h4 mb-0 text-white">Formulario de Contacto</h2>
                    </div>
                    <div class="card-body p-4">
                        <div id="alert-container"></div>
                        
                        <form id="contact-form">
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-bold">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required>
                            </div>
                            <div class="mb-3">
                                <label for="telefono" class="form-label fw-bold">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono" required>
                            </div>
                            <div class="mb-3">
                                <label for="cancha" class="form-label fw-bold">Cancha</label>
                                <input type="text" class="form-control" id="cancha" name="cancha" required>
                            </div>
                            <div class="mb-3">
                                <label for="hora_solicitada" class="form-label fw-bold">Hora Solicitada</label>
                                <input type="text" class="form-control" id="hora_solicitada" name="hora_solicitada" placeholder="Ej: Sábado 18:00" required>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-success py-2 fw-bold" id="submit-btn">
                                    ENVIAR SOLICITUD
                                </button>
                            </div>
                        </form>

                        <div id="thank-you" class="text-center py-4 d-none">
                            <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
                            <h3 class="mt-3">¡Gracias!</h3>
                            <p>Tu mensaje ha sido enviado correctamente. Nos pondremos en contacto contigo pronto.</p>
                            <a href="index.html" class="btn btn-outline-success mt-2">Volver al inicio</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Supabase Library -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        const supabaseUrl = 'https://cceshuvaqcnqahckqnkd.supabase.co'
        const supabaseKey = 'sb_publishable_4IKEyDSOUoc3O8sdq1V3gA_w2pumpSm'
        const supabase = createClient(supabaseUrl, supabaseKey)

        const contactForm = document.getElementById('contact-form');
        const thankYou = document.getElementById('thank-you');
        const alertContainer = document.getElementById('alert-container');
        const submitBtn = document.getElementById('submit-btn');

        contactForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Reset state
            alertContainer.innerHTML = '';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Enviando...';

            const formData = new FormData(contactForm);
            const data = {
                nombre: formData.get('nombre'),
                telefono: formData.get('telefono'),
                cancha: formData.get('cancha'),
                hora_solicitada: formData.get('hora_solicitada')
            };

            try {
                const { error } = await supabase
                    .from('mensajes_contacto')
                    .insert([data]);

                if (error) throw error;

                // Success
                contactForm.classList.add('d-none');
                thankYou.classList.remove('d-none');
            } catch (error) {
                console.error('Error saving to Supabase:', error);
                alertContainer.innerHTML = `
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong>Error:</strong> ${error.message || 'No se pudo enviar el mensaje. Por favor intenta de nuevo.'}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                `;
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'ENVIAR SOLICITUD';
            }
        });
    </script>

    <!-- Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
