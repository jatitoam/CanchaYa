<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanchaYa - Soccer Fields</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="img/favicon.svg">
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="py-5 mb-5">
        <div class="container text-center">
            <h1>CanchaYa</h1>
            <p class="lead text-white-50">Directorio de canchas en Guatemala</p>
        </div>
    </header>

    <main class="container">
        <section id="filter-section" class="mb-4">
            <div class="row align-items-center">
                <div class="col-auto">
                    <label for="surface-filter" class="form-label mb-0">Filtrar por superficie:</label>
                </div>
                <div class="col-auto">
                    <select id="surface-filter" class="form-select">
                        <option value="All">Todas</option>
                    </select>
                </div>
            </div>
        </section>

        <section id="fields-container" class="row g-4">
            <!-- Field cards will be injected here -->
        </section>
    </main>

    <!-- Bootstrap 5 -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="script.js"></script>
    <script src="chatbot.js"></script>
</body>
</html>
